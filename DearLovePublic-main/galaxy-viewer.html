<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Dải Ngân Hà 3D - Galaxy Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            background-color: #000; 
        }

        body {
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
            font-family: 'Orbitron', 'Courier New', monospace;
            perspective: 1500px;
            cursor: grab;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #000;
        }

        body:active {
            cursor: grabbing;
        }

        .galaxy-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg) scale(1);
            will-change: transform;
        }

        .text-particle {
            position: absolute;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            text-shadow: 
                0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 30px currentColor,
                2px 2px 4px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            pointer-events: none;
            letter-spacing: 1px;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .text-particle.love {
            color: #ff6b9d;
            text-shadow: 
                0 0 15px currentColor,
                0 0 25px currentColor,
                0 0 35px currentColor,
                2px 2px 6px rgba(0,0,0,0.9);
        }

        .text-particle.birthday {
            color: #4ecdc4;
            text-shadow: 
                0 0 15px currentColor,
                0 0 25px currentColor,
                0 0 35px currentColor,
                2px 2px 6px rgba(0,0,0,0.9);
        }

        .text-particle.date {
            color: #c534ed;
            text-shadow: 
                0 0 20px currentColor,
                0 0 30px currentColor,
                0 0 40px currentColor,
                2px 2px 6px rgba(0,0,0,0.9);
        }

        .text-particle.special {
            color: #f34bce;
            text-shadow: 
                0 0 15px currentColor,
                0 0 25px currentColor,
                0 0 35px currentColor,
                2px 2px 6px rgba(0,0,0,0.9);
        }

        .text-particle.heart {
            color: #ff69b4;
            text-shadow: 
                0 0 20px currentColor,
                0 0 30px currentColor,
                0 0 40px currentColor,
                3px 3px 8px rgba(0,0,0,0.9);
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: twinkle 3s infinite;
            will-change: opacity;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
            font-family: 'Orbitron', sans-serif;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            padding: 2rem;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .back-home {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: linear-gradient(45deg, #ff6b9d, #4ecdc4);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 157, 0.4);
        }

        /* Mobile specific styles */
        @media (max-width: 768px) {
            body {
                perspective: 1000px;
            }
            
            .galaxy-container {
                perspective: 1000px;
            }
            
            .text-particle {
                font-size: 12px;
                letter-spacing: 0.5px;
            }
            
            .text-particle.heart {
                font-size: 16px;
            }
            
            .star {
                width: 1.5px;
                height: 1.5px;
            }
        }

        @media (max-width: 480px) {
            .text-particle {
                font-size: 10px;
                letter-spacing: 0.3px;
            }
            
            .text-particle.heart {
                font-size: 14px;
            }
            
            .star {
                width: 1px;
                height: 1px;
            }
        }

        /* Landscape orientation on mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .text-particle {
                font-size: 10px;
            }
            
            .text-particle.heart {
                font-size: 12px;
            }
        }
.image-particle {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    backface-visibility: hidden;
    z-index: 2;
    border-radius: 15px;
    display: block;
    object-fit: cover;
}
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <h2>Những điều tốt đẹp đều cần thời gian...</h2>
        <p>Vui lòng đợi trong giây lát</p>
    </div>

    <div class="error-screen" id="errorScreen">
        <div class="error-icon">😢</div>
        <h2>Không tìm thấy website</h2>
        <p>Link này có thể đã hết hạn hoặc không tồn tại.</p>
        <a href="index.html" class="back-home">🏠 Về trang chủ</a>
    </div>

    <div class="galaxy-container" id="galaxy">
        <!-- Các text particles sẽ được tạo bằng JavaScript -->
    </div>

    <audio id="galaxyAudio" controls style="display:none"></audio>

    <script type="module">
        let db = null;
        let doc = null;
        let getDoc = null;

        async function loadFirebaseHelpers() {
            try {
                const firebaseModule = await import('./firebase-config.js');
                db = firebaseModule.db;
                doc = firebaseModule.doc;
                getDoc = firebaseModule.getDoc;
                return true;
            } catch (error) {
                console.warn('Firebase config is not available. Checking local stored galaxy data.', error);
                return false;
            }
        }

        // Lấy galaxy ID từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const galaxyId = urlParams.get('id');
        const isDemo = urlParams.get('demo') === '1';


        const fallbackImageUrls = [
            "https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1525253086316-d0c936c814f8?auto=format&fit=crop&w=800&q=80"
        ];

        function makeHeartDataUri(primaryColor, secondaryColor, accentColor) {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
                            <stop offset="0%" stop-color="#120812"/>
                            <stop offset="100%" stop-color="#1a1020"/>
                        </linearGradient>
                        <linearGradient id="heartFill" x1="0" x2="1" y1="0" y2="1">
                            <stop offset="0%" stop-color="${primaryColor}"/>
                            <stop offset="100%" stop-color="${secondaryColor}"/>
                        </linearGradient>
                    </defs>
                    <rect width="200" height="200" rx="28" fill="url(#bg)"/>
                    <circle cx="100" cy="68" r="56" fill="rgba(255,255,255,0.12)"/>
                    <path d="M100 162C80 142 34 111 34 76C34 54 51 38 70 38C84 38 93 46 100 58C107 46 116 38 130 38C149 38 166 54 166 76C166 111 120 142 100 162Z" fill="url(#heartFill)" stroke="${accentColor}" stroke-width="6" stroke-linejoin="round"/>
                    <circle cx="72" cy="86" r="7" fill="${accentColor}" opacity="0.9"/>
                    <circle cx="128" cy="86" r="7" fill="${accentColor}" opacity="0.9"/>
                    <path d="M82 108C89 116 96 120 100 120C104 120 111 116 118 108" fill="none" stroke="${accentColor}" stroke-width="5" stroke-linecap="round"/>
                </svg>
            `;
            return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        }

        const localHeartImageSet = [
            makeHeartDataUri('#ff6b9d', '#ff9ec4', '#fff7fb'),
            makeHeartDataUri('#4ecdc4', '#9ff3ea', '#ffffff'),
            makeHeartDataUri('#c084fc', '#f9b4ff', '#fff7ff')
        ];

        const demoGalaxyData = {
    messages: [
        "I love you so much! ❤️",
        "Our Anniverasry",
        "I love you 💖",
        "25/08/2004",
        "Thank you for being my sunshine ",
        "Thank you for being my everything 💕",
        "You are my universe ", 
        "There is no other",
        "You’re amazing", 
        "You make my heart smile ", 
        "Love ya! 💖",
        "Honey bunch, you are my everything! ",



    ],
    icons: ["♥", "💖", "❤️", "❤️", "💕", "💕"],
    colors: {
        love: "#ff6b9d",
        birthday: "#4ecdc4",
        date: "#ff69b4",
        special: "#ff6b9d",
        heart: "#ff69b4"
    },
    images: localHeartImageSet,
    song: "eyenoselip.mp3",
    createdAt: "2025-05-30T00:00:00.000Z"
};

        const loadingScreen = document.getElementById('loadingScreen');
        const errorScreen = document.getElementById('errorScreen');
        const galaxy = document.getElementById('galaxy');

        let galaxyData = null;
        let rotationX = 0;
        let rotationY = 0;
        let scale = 1;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        const activeParticles = new Set();

        // Responsive settings
        const isMobile = window.innerWidth <= 768;
        const isSmallMobile = window.innerWidth <= 480;
        // Tăng số lượng particle tối đa
        const maxParticles = isSmallMobile ? 150 : isMobile ? 200 : 300;
        // Giảm thời gian giữa các lần tạo particle (tăng tần suất)
        const particleInterval = isMobile ? 100 : 120;
        const starCount = isSmallMobile ? 250 : isMobile ? 350 : 500;

        let particleSpeedMultiplier = 1.3; // 1 là bình thường, >1 là chậm lại

        // Làm chậm khi ấn giữ chuột hoặc giữ tay trên màn hình
document.addEventListener('mousedown', () => {
    particleSpeedMultiplier = 1.7;
});
document.addEventListener('mouseup', () => {
    particleSpeedMultiplier = 1;
});
document.addEventListener('touchstart', (e) => {
    // Chỉ làm chậm khi chỉ có 1 ngón (không phải pinch zoom)
    if (e.touches.length === 1) particleSpeedMultiplier = 1.7;
});
document.addEventListener('touchend', () => {
    particleSpeedMultiplier = 1;
});

        // Prevent scrolling and zooming
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });

        // Load galaxy data from Firebase
        async function loadGalaxyData() {
             if (isDemo) {
                galaxyData = demoGalaxyData;
                initializeGalaxy();
                return;
            }

            const firebaseReady = await loadFirebaseHelpers();
            if (!galaxyId) {
                showError();
                return;
            }

            if (!firebaseReady) {
                const savedGalaxies = JSON.parse(localStorage.getItem('dearlove-galaxies') || '{}');
                const savedGalaxy = savedGalaxies[galaxyId];
                if (savedGalaxy) {
                    galaxyData = savedGalaxy;
                    initializeGalaxy();
                    return;
                }
                showError();
                return;
            }

            try {
                const docRef = doc(db, "galaxies", galaxyId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    galaxyData = docSnap.data();
                    initializeGalaxy();
                } else {
                    const savedGalaxies = JSON.parse(localStorage.getItem('dearlove-galaxies') || '{}');
                    const savedGalaxy = savedGalaxies[galaxyId];
                    if (savedGalaxy) {
                        galaxyData = savedGalaxy;
                        initializeGalaxy();
                    } else {
                        showError();
                    }
                }
            } catch (error) {
                console.error('Error loading galaxy:', error);
                const savedGalaxies = JSON.parse(localStorage.getItem('dearlove-galaxies') || '{}');
                const savedGalaxy = savedGalaxies[galaxyId];
                if (savedGalaxy) {
                    galaxyData = savedGalaxy;
                    initializeGalaxy();
                } else {
                    showError();
                }
            }
        }

        function showError() {
            loadingScreen.style.display = 'none';
            errorScreen.style.display = 'flex';
        }

        function initializeGalaxy() {
            loadingScreen.style.display = 'none';
            
            // Apply custom colors to CSS
            const style = document.createElement('style');
            style.textContent = `
                .text-particle.love { color: ${galaxyData.colors.love}; text-shadow: 0 0 15px ${galaxyData.colors.love}, 0 0 25px ${galaxyData.colors.love}, 0 0 35px ${galaxyData.colors.love}, 2px 2px 6px rgba(0,0,0,0.9); }
                .text-particle.birthday { color: ${galaxyData.colors.birthday}; text-shadow: 0 0 15px ${galaxyData.colors.birthday}, 0 0 25px ${galaxyData.colors.birthday}, 0 0 35px ${galaxyData.colors.birthday}, 2px 2px 6px rgba(0,0,0,0.9); }
                .text-particle.date { color: ${galaxyData.colors.date}; text-shadow: 0 0 20px ${galaxyData.colors.date}, 0 0 30px ${galaxyData.colors.date}, 0 0 40px ${galaxyData.colors.date}, 2px 2px 6px rgba(0,0,0,0.9); }
                .text-particle.special { color: ${galaxyData.colors.special}; text-shadow: 0 0 15px ${galaxyData.colors.special}, 0 0 25px ${galaxyData.colors.special}, 0 0 35px ${galaxyData.colors.special}, 2px 2px 6px rgba(0,0,0,0.9); }
                .text-particle.heart { color: ${galaxyData.colors.heart}; text-shadow: 0 0 20px ${galaxyData.colors.heart}, 0 0 30px ${galaxyData.colors.heart}, 0 0 40px ${galaxyData.colors.heart}, 3px 3px 8px rgba(0,0,0,0.9); }
            `;
            document.head.appendChild(style);

            // Phát nhạc nếu có
    if (galaxyData.song) {
        const audio = document.getElementById('galaxyAudio');
        if (galaxyData.song.startsWith('http')) {
            audio.src = galaxyData.song;
        } else {
            audio.src = `songs/${galaxyData.song}`;
        }
        // Tự động phát thử (sẽ bị chặn trên mobile)
        audio.play().catch(() => {});
        // Thêm đoạn này để phát khi user chạm lần đầu
        const playAudioOnUserGesture = () => {
            audio.play().catch(() => {});
            document.removeEventListener('touchstart', playAudioOnUserGesture);
            document.removeEventListener('click', playAudioOnUserGesture);
        };
        document.addEventListener('touchstart', playAudioOnUserGesture);
        document.addEventListener('click', playAudioOnUserGesture);
    }

            createStars();
            startParticleAnimation();
        }

        function getRandomMessage() {
            return galaxyData.messages[Math.floor(Math.random() * galaxyData.messages.length)];
        }

        function getRandomIcon() {
            return galaxyData.icons[Math.floor(Math.random() * galaxyData.icons.length)];
        }

        function getMessageClass(message) {
            const lowerMessage = message.toLowerCase();
            if (lowerMessage.includes("love") || lowerMessage.includes("yêu") || lowerMessage.includes("tình")) {
                return "love";
            } else if (lowerMessage.includes("birthday") || lowerMessage.includes("sinh nhật") || lowerMessage.includes("chúc mừng")) {
                return "birthday";
            } else if (/\d/.test(message) || message.includes("/")) {
                return "date";
            } else {
                return "special";
            }
        }

        function createTextParticle() {
            if (activeParticles.size >= maxParticles) {
                return;
            }

            const isIcon = Math.random() > 0.7;
            const element = document.createElement('div');
            
            if (isIcon) {
                element.className = 'text-particle heart';
                element.textContent = getRandomIcon();
            } else {
                const message = getRandomMessage();
                element.className = `text-particle ${getMessageClass(message)}`;
                element.textContent = message;
            }
            
            const xPos = Math.random() * 100;
            const zPos = (Math.random() - 0.5) * (isMobile ? 300 : 500);
            const animationDuration = Math.random() * 2 + (isMobile ? 3 : 3);
            
            element.style.left = xPos + '%';
            
            const baseFontSize = isSmallMobile ? 8 : isMobile ? 12 : 18; // desktop to hơn
const fontSizeVariation = isSmallMobile ? 4 : isMobile ? 5 : 8;
            element.style.fontSize = (Math.random() * fontSizeVariation + baseFontSize) + 'px';
            
            const depthOpacity = Math.max(0.4, 1 - Math.abs(zPos) / (isMobile ? 250 : 400));
            element.style.opacity = depthOpacity;
            
            let startTime = null;
            let startY = -150;
            let endY = window.innerHeight + 150;
            const thisParticleSpeed = particleSpeedMultiplier; // Lưu multiplier tại thời điểm tạo

            function animateParticle(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = (timestamp - startTime) / (animationDuration * 1000 * thisParticleSpeed);
                
                if (progress < 1) {
                    const currentY = startY + (endY - startY) * progress;
                    const opacity = progress < 0.05 ? progress * 20 : 
                                  progress > 0.95 ? (1 - progress) * 20 : 
                                  depthOpacity;
                    
                    element.style.transform = `translate3d(0, ${currentY}px, ${zPos}px)`;
                    element.style.opacity = opacity;
                    
                    requestAnimationFrame(animateParticle);
                } else {
                    if (element.parentNode) {
                        element.parentNode.removeChild(element);
                        activeParticles.delete(element);
                    }
                }
            }
            
            galaxy.appendChild(element);
            activeParticles.add(element);
            requestAnimationFrame(animateParticle);
        }

      function createStars() {
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const angle = Math.random() * Math.PI * 10;
                const radius = Math.random() * (isMobile ? 800 : 1500) + (isMobile ? 200 : 300);
                const spiralHeight = Math.sin(angle) * (isMobile ? 100 : 150);
                
                const x = Math.cos(angle) * radius;
                const y = spiralHeight + (Math.random() - 0.5) * (isMobile ? 1000 : 2000);
                const z = Math.sin(angle) * radius * 0.5;
                
                star.style.left = `calc(50% + ${x}px)`;
                star.style.top = `calc(50% + ${y}px)`;
                star.style.transform = `translateZ(${z}px)`;
                star.style.animationDelay = Math.random() * 3 + 's';
                
                const depthBrightness = Math.max(0.1, 1 - Math.abs(z) / (isMobile ? 800 : 1200));
                star.style.opacity = depthBrightness;
                
                galaxy.appendChild(star);
            }
        }

        function updateGalaxyTransform() {
            requestAnimationFrame(() => {
                galaxy.style.transform = `translate(-50%, -50%) rotateX(${rotationX}deg) rotateY(${rotationY}deg) scale(${scale})`;
            });
        }

        function startParticleAnimation() {
            const imageUrls = Array.isArray(galaxyData.images) ? galaxyData.images.filter(Boolean) : [];
            const validImageUrls = imageUrls.length > 0 ? imageUrls : localHeartImageSet;

            setInterval(() => {
                if (validImageUrls.length > 0 && Math.random() < 0.35) {
                    createImageParticle();
                } else {
                    createTextParticle();
                }
            }, particleInterval);

            const initialParticles = isMobile ? 20 : 15;
            for (let i = 0; i < initialParticles; i++) {
                setTimeout(() => {
                    if (validImageUrls.length > 0 && Math.random() < 0.35) {
                        createImageParticle();
                    } else {
                        createTextParticle();
                    }
                }, i * (particleInterval * 0.6));
            }
        }

        // Mouse events for desktop
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                const sensitivity = isMobile ? 0.3 : 0.5;
                rotationY += deltaX * sensitivity;
                rotationX -= deltaY * sensitivity;
                
                updateGalaxyTransform();
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Enhanced touch events for mobile
        let initialDistance = 0;
        let initialScale = 1;

        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                initialDistance = Math.sqrt(
                    Math.pow(touch2.clientX - touch1.clientX, 2) +
                    Math.pow(touch2.clientY - touch1.clientY, 2)
                );
                initialScale = scale;
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                const sensitivity = 0.3;
                rotationY += deltaX * sensitivity;
                rotationX -= deltaY * sensitivity;
                
                updateGalaxyTransform();
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const currentDistance = Math.sqrt(
                    Math.pow(touch2.clientX - touch1.clientX, 2) +
                    Math.pow(touch2.clientY - touch1.clientY, 2)
                );
                
                const scaleChange = currentDistance / initialDistance;
                scale = Math.max(0.5, Math.min(2, initialScale * scaleChange));
                
                updateGalaxyTransform();
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDragging = false;
        }, { passive: false });

        // Handle orientation change
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                location.reload();
            }, 100);
        });

        // Initialize
        loadGalaxyData();

        function createImageParticle() {
    const imageUrls = Array.isArray(galaxyData.images) ? galaxyData.images.filter(Boolean) : [];
    const validImageUrls = imageUrls.length > 0 ? imageUrls : localHeartImageSet;
    if (validImageUrls.length === 0 || activeParticles.size >= maxParticles) return;

    const img = document.createElement('img');
    const imageUrl = validImageUrls[Math.floor(Math.random() * validImageUrls.length)];
    img.src = imageUrl;
    img.className = 'text-particle image-particle';
    img.alt = 'love image';
    img.loading = 'eager';
    img.decoding = 'async';
    img.style.width = (Math.random() * 40 + 60) + 'px';
    img.style.height = 'auto';
    img.style.maxHeight = '120px';
    img.style.borderRadius = '15px';
    img.style.boxShadow = '0 4px 24px rgba(0,0,0,0.18)';
    img.style.background = '#fff';

    const fallbackToDefault = () => {
        if (img.parentNode) {
            img.parentNode.removeChild(img);
        }
        activeParticles.delete(img);
        if (localHeartImageSet.length > 0 && imageUrl !== localHeartImageSet[0]) {
            const fallbackImg = new Image();
            fallbackImg.src = localHeartImageSet[Math.floor(Math.random() * localHeartImageSet.length)];
            fallbackImg.onload = () => {
                const replacement = document.createElement('img');
                replacement.src = fallbackImg.src;
                replacement.className = 'text-particle image-particle';
                replacement.alt = 'love image';
                replacement.style.width = img.style.width;
                replacement.style.height = 'auto';
                replacement.style.maxHeight = '120px';
                replacement.style.borderRadius = '15px';
                replacement.style.boxShadow = '0 4px 24px rgba(0,0,0,0.18)';
                replacement.style.left = img.style.left;
                replacement.style.opacity = img.style.opacity;
                replacement.style.transform = img.style.transform;
                galaxy.appendChild(replacement);
                activeParticles.add(replacement);
            };
        }
    };

    img.addEventListener('error', fallbackToDefault);

    const xPos = Math.random() * 100;
    const zPos = (Math.random() - 0.5) * (isMobile ? 300 : 500);
    const animationDuration = Math.random() * 2 + (isMobile ? 3 : 3);

    img.style.left = xPos + '%';

    let startTime = null;
    let startY = -150;
    let endY = window.innerHeight + 150;
    const thisParticleSpeed = particleSpeedMultiplier;

    function animateParticle(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = (timestamp - startTime) / (animationDuration * 1000 * thisParticleSpeed);

        if (progress < 1) {
            const currentY = startY + (endY - startY) * progress;
            const opacity = progress < 0.05 ? progress * 20 :
                progress > 0.95 ? (1 - progress) * 20 :
                1;
            img.style.transform = `translate3d(0, ${currentY}px, ${zPos}px)`;
            img.style.opacity = opacity;

            requestAnimationFrame(animateParticle);
        } else {
            if (img.parentNode) {
                img.parentNode.removeChild(img);
                activeParticles.delete(img);
            }
        }
    }

    galaxy.appendChild(img);
    activeParticles.add(img);
    requestAnimationFrame(animateParticle);
}
